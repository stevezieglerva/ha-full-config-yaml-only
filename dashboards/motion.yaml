title: Motion
views:
  - title: Motion
    path: motion
    icon: mdi:motion-sensor
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: entities
            title: Upstairs Motion
            show_header_toggle: false
            entities:
              - entity: sensor.minutes_since_master_bedroom_motion
              - entity: sensor.minutes_since_master_bathroom_motion
              - entity: sensor.minutes_since_owen_motion
              - entity: sensor.minutes_since_william_motion
              - entity: sensor.minutes_since_charlotte_motion

      - type: grid
        cards:
          - type: entities
            title: Downstairs Motion
            show_header_toggle: false
            entities:
              - entity: sensor.minutes_since_kitchen_motion
              - entity: sensor.minutes_since_living_room_motion
              - entity: sensor.minutes_since_dropzone_motion
              - entity: sensor.minutes_since_pantry_motion
              - entity: sensor.minutes_since_garage_motion
              - entity: sensor.minutes_since_office_motion

      - type: grid
        cards:
          - type: entities
            title: Upstairs Motion Sensors
            show_header_toggle: false
            entities:
              - entity: sensor.charlotte_night_light_occupancy_elapsed_occupancy
                name: Charlotte Night Light Occupancy
              - entity: sensor.extra_night_light_occupancy_elapsed_occupancy
                name: Extra Night Light Occupancy
              - entity: sensor.master_bathroom_motion_occupancy_elapsed_occupancy
                name: Master Bathroom Motion Occupancy
              - entity: sensor.master_bedroom_motion_occupancy_elapsed_occupancy
                name: Master Bedroom Motion Occupancy
              - entity: sensor.master_bedroom_night_light_w_n3_occupancy_elapsed_occupancy
                name: Night Light-W N3 Occupancy
              - entity: sensor.master_bathroom_night_light_w_n4_occupancy_elapsed_occupancy
                name: Night Light-W N4 Occupancy
              - entity: sensor.owen_night_light_occupancy_2_elapsed_occupancy
                name: Owen Night Light Occupancy
              - entity: sensor.william_night_light_occupancy_elapsed_occupancy
                name: William Night Light Occupancy

          - type: entities
            title: Downstairs Motion Sensors
            show_header_toggle: false
            entities:
              - entity: sensor.dropzone_motion_occupancy_elapsed_occupancy
                name: Dropzone Motion Occupancy
              - entity: sensor.garage_motion_backdoor_occupancy_elapsed_occupancy
                name: Garage Motion Backdoor Occupancy
              - entity: sensor.kitchen_motion_occupancy_elapsed_occupancy
                name: Kitchen Motion Occupancy
              - entity: sensor.living_room_motion_occupancy_elapsed_occupancy
                name: Living Room Motion Occupancy
              - entity: sensor.garage_night_light_w_n1_occupancy_elapsed_occupancy
                name: Night Light-W N1 Occupancy
              - entity: sensor.garage_night_light_w_n2_occupancy_elapsed_occupancy
                name: Night Light-W N2 Occupancy
              - entity: sensor.office_motion_sensor_occupancy_elapsed_occupancy
                name: Office-motion-sensor Occupancy
              - entity: sensor.pantry_night_light_occupancy_elapsed_occupancy
                name: Pantry Night Light Occupancy
              - entity: sensor.pantry_night_light_occupancy_2_elapsed_occupancy
                name: Pantry Night Light Occupancy
              - entity: sensor.pantry_night_light_occupancy_3_elapsed_occupancy
                name: Pantry Night Light Occupancy
              - entity: sensor.playroom_motion_occupancy_elapsed_occupancy
                name: Playroom Motion Occupancy
