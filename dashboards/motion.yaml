title: Motion
views:
  - title: Motion
    path: motion
    icon: mdi:motion-sensor
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: entities
            title: Upstairs Motion
            show_header_toggle: false
            entities:
              - entity: sensor.minutes_since_master_bedroom_motion
              - entity: sensor.minutes_since_master_bathroom_motion
              - entity: sensor.minutes_since_owen_motion
              - entity: sensor.minutes_since_william_motion
              - entity: sensor.minutes_since_charlotte_motion

      - type: grid
        cards:
          - type: entities
            title: Downstairs Motion
            show_header_toggle: false
            entities:
              - entity: sensor.minutes_since_kitchen_motion
              - entity: sensor.minutes_since_living_room_motion
              - entity: sensor.minutes_since_dropzone_motion
              - entity: sensor.minutes_since_pantry_motion
              - entity: sensor.minutes_since_garage_motion
              - entity: sensor.minutes_since_office_motion

          - type: entities
            title: Presence
            show_header_toggle: false
            entities:
              - entity: input_boolean.steve_on_wifi

      - type: grid
        cards:
          - type: entities
            title: Upstairs Motion Sensors
            show_header_toggle: false
            entities:
              - entity: binary_sensor.charlotte_night_light_occupancy
              - entity: binary_sensor.extra_night_light_occupancy
              - entity: binary_sensor.master_bathroom_motion_occupancy
              - entity: binary_sensor.master_bedroom_motion_occupancy
              - entity: binary_sensor.master_bedroom_night_light_w_n3_occupancy
              - entity: binary_sensor.master_bathroom_night_light_w_n4_occupancy
              - entity: binary_sensor.owen_night_light_occupancy_2
              - entity: binary_sensor.william_night_light_occupancy

          - type: entities
            title: Downstairs Motion Sensors
            show_header_toggle: false
            entities:
              - entity: binary_sensor.dropzone_motion_occupancy
              - entity: binary_sensor.garage_motion_backdoor_occupancy
              - entity: binary_sensor.kitchen_motion_occupancy
              - entity: binary_sensor.living_room_motion_occupancy
              - entity: binary_sensor.garage_night_light_w_n1_occupancy
              - entity: binary_sensor.garage_night_light_w_n2_occupancy
              - entity: binary_sensor.office_motion_sensor_occupancy
              - entity: binary_sensor.pantry_night_light_occupancy
              - entity: binary_sensor.pantry_night_light_occupancy_2
              - entity: binary_sensor.pantry_night_light_occupancy_3
              - entity: binary_sensor.playroom_motion_occupancy
